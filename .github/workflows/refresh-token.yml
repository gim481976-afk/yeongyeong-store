# 스레드 토큰 자동 연장 (토큰은 60일 동안 갱신하지 않으면 만료됨)
# 필요한 Secrets: THREADS_TOKEN, GH_PAT (이 저장소의 Secrets 쓰기 권한이 있는 GitHub 토큰)
name: refresh-threads-token

on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 (한국 시간)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 연장
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$THREADS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then
            echo "THREADS_TOKEN 또는 GH_PAT 가 없어 건너뜁니다."; exit 0
          fi
          RESP=$(curl -s --get "https://graph.threads.com/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=$THREADS_TOKEN")
          NEW=$(echo "$RESP" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then
            echo "연장 실패: $(echo "$RESP" | jq -c '.error // .')"; exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "토큰 연장 완료 (만료까지 약 $(( $(echo "$RESP" | jq -r '.expires_in') / 86400 ))일)"
